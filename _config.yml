title: Linux Sincero
description: "Tutoriais diretos e práticos sobre Linux, homelab, bancos de dados e utilitários."
lang: pt-BR
markdown: kramdown

# for atom feed
author:
  name: Max Cleiton
  email: maxcleiton@live.com

url: "https://maxxcleiton.github.io"

plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections_dir: all_collections
collections:
  posts:
    output: true

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title/
exclude: ["LICENSE", "README.md", "rodar_server.sh", "Gemfile", "Gemfile.lock"]
